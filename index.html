<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motivio.pedro | El Taller de Video</title>
    <style>
        /* CONFIGURACIÓN VISUAL (CARROCERÍA) */
        body { background-color: #121212; color: #e0e0e0; font-family: sans-serif; margin: 0; text-align: center; }
        header { background: #1f1f1f; padding: 15px; border-bottom: 2px solid #00a8ff; }
        .brand { font-size: 28px; font-weight: bold; color: #00a8ff; }
        .brand span { color: white; }
        
        /* CAJA DE PREVISUALIZACIÓN (EL MARCO) */
        .preview-container {
            width: 95%;
            max-width: 800px;
            height: 450px; /* Altura máxima */
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            border: 2px solid #333;
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease; /* Para que el cambio de tamaño sea suave */
        }

        video { max-width: 100%; max-height: 100%; object-fit: contain; }

        /* BOTONERA */
        .toolbar { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; padding: 20px; max-width: 900px; margin: 0 auto; }
        button { background: #2a2a2a; color: white; border: 1px solid #444; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        button:hover { background: #00a8ff; border-color: white; }
        .btn-active { background: #00a8ff; border-color: white; }
        
        .footer { padding: 20px; font-size: 13px; color: #666; }
    </style>
</head>
<body>

<header>
    <div class="brand">MOTIVIO<span>.pedro</span></div>
    <p style="margin:5px 0 0; font-size: 14px; color: #aaa;">Procesamiento Local | Sin Costo</p>
</header>

<div class="preview-container" id="container">
    <div id="display">
        <p>📷 Selecciona un video para empezar</p>
        <input type="file" id="videoInput" accept="video/*" style="display:none">
        <button onclick="document.getElementById('videoInput').click()">Abrir Archivo</button>
    </div>
</div>

<p>Ajustar Formato:</p>
<div style="margin-bottom: 20px;">
    <button onclick="cambiarFormato('9/16')">📱 TikTok</button>
    <button onclick="cambiarFormato('16/9')">📺 YouTube</button>
    <button onclick="cambiarFormato('1/1')">🔳 Cuadrado</button>
</div>

<div class="toolbar">
    <button onclick="alert('Próximamente: Motor FFmpeg')">✂️ Cortar</button>
    <button onclick="alert('Próximamente: IA local')">🗣️ Voz IA</button>
    <button style="background: #22c55e;">💾 EXPORTAR</button>
</div>

<div class="footer">
    Desarrollado por Pedro Pérez - Motivio.pedro v1.1
</div>

<script>
    const videoInput = document.getElementById('videoInput');
    const display = document.getElementById('display');
    const container = document.getElementById('container');

    // Función para subir y ver el video
    videoInput.addEventListener('change', function() {
        const file = this.files[0];
        if (file) {
            const url = URL.createObjectURL(file);
            display.innerHTML = `<video id="mainVideo" controls>
                <source src="${url}" type="${file.type}">
            </video>`;
        }
    });

    // Función para cambiar el tamaño del marco (La Guía)
    function cambiarFormato(ratio) {
        if (ratio === '9/16') {
            container.style.width = "250px";
            container.style.height = "450px";
        } else if (ratio === '16/9') {
            container.style.width = "95%";
            container.style.height = "300px";
        } else if (ratio === '1/1') {
            container.style.width = "350px";
            container.style.height = "350px";
        }
    }
</script>

</body>
</html>
