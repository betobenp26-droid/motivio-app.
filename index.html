<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motivio.pedro | El Taller de Video</title>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; text-align: center; }
        header { background: #1f1f1f; padding: 15px; border-bottom: 2px solid #00a8ff; }
        .brand { font-size: 28px; font-weight: bold; color: #00a8ff; }
        .brand span { color: white; }
        .preview-box { width: 90%; max-width: 800px; height: 400px; background: #000; margin: 20px auto; border: 2px solid #333; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
        .toolbar { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; padding: 20px; max-width: 900px; margin: 0 auto; }
        button { background: #2a2a2a; color: white; border: 1px solid #444; padding: 20px; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #00a8ff; border-color: white; transform: translateY(-3px); }
        .footer { padding: 20px; font-size: 14px; color: #666; }
    </style>
</head>
<body>

<header>
    <div class="brand">MOTIVIO<span>.pedro</span></div>
    <p style="margin:5px 0 0; font-size: 14px; color: #aaa;">La Guía de IA en tu bolsillo</p>
</header>

<div class="preview-box">
    <div id="display">
        <p>📷 Arrastra tu video aquí</p>
        <input type="file" id="videoInput" accept="video/*" style="display:none">
        <button onclick="document.getElementById('videoInput').click()">Seleccionar Archivo</button>
    </div>
</div>

<div class="toolbar">
    <button>✂️ Cortar (Local)</button>
    <button>🗣️ Avatar IA (Local)</button>
    <button>🚫 Quitar Marca</button>
    <button>🎵 Música Libre</button>
    <button>📐 Formato (TikTok/YT)</button>
    <button style="background: #00a8ff;">💾 EXPORTAR GRATIS</button>
</div>

<div class="footer">
    Proyecto Motivio.pedro - Procesamiento 100% en tu dispositivo.
</div>
<script>
    const videoInput = document.getElementById('videoInput');
    const display = document.getElementById('display');

    videoInput.addEventListener('change', function() {
        const file = this.files[0];
        if (file) {
            const url = URL.createObjectURL(file);
            display.innerHTML = `<video controls style="width:100%; max-height:100%;">
                <source src="${url}" type="${file.type}">
            </video>`;
        }
    });
</script>


</body>
</html>
