<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Motivio.pedro | Studio</title>
    <style>
        body { background-color: #0a0a0a; color: #ffffff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        header { background: #111; padding: 15px; border-bottom: 1px solid #333; text-align: center; }
        .brand { font-size: 22px; font-weight: bold; letter-spacing: 1px; color: #00a8ff; }
        .brand span { color: #fff; }

        /* ÁREA DE TRABAJO PROFESIONAL */
        .workspace {
            width: 100%;
            height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            position: relative;
            overflow: hidden;
        }

        /* EL MARCO DINÁMICO */
        .viewport {
            border: 1px solid #444;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        video {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* Esto asegura que el video se vea COMPLETO siempre */
        }

        /* SELECTOR DE FORMATO TÉCNICO */
        .format-selector {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 20px;
            background: #111;
        }

        .ratio-btn {
            background: transparent;
            color: #888;
            border: 1px solid #333;
            padding: 8px 15px;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }

        .ratio-btn:hover, .ratio-btn.active {
            color: #00a8ff;
            border-color: #00a8ff;
            background: rgba(0, 168, 255, 0.1);
        }

        /* BARRA DE HERRAMIENTAS INFERIOR */
        .bottom-nav {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        .tool-btn {
            background: #1a1a1a;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 12px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .export-btn {
            grid-column: span 3;
            background: #00a8ff;
            color: white;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<header>
    <div class="brand">MOTIVIO<span>.pedro</span></div>
</header>

<div class="workspace">
    <div class="viewport" id="viewport" style="width: 300px; height: 300px;">
        <div id="player" style="width:100%; height:100%; display:flex; align-items:center; justify-content:center;">
            <button onclick="document.getElementById('fileIn').click()" style="background:#222; color:#fff; border:1px solid #444; padding:10px 20px; border-radius:5px; cursor:pointer;">+ CARGAR MEDIA</button>
        </div>
    </div>
    <input type="file" id="fileIn" accept="video/*" style="display:none">
</div>

<div class="format-selector">
    <button class="ratio-btn" onclick="setRatio('9:16', this)">9:16</button>
    <button class="ratio-btn" onclick="setRatio('1:1', this)">1:1</button>
    <button class="ratio-btn active" onclick="setRatio('16:9', this)">16:9</button>
    <button class="ratio-btn" onclick="setRatio('4:5', this)">4:5</button>
</div>

<div class="bottom-nav">
    <button class="tool-btn" onclick="alert('Iniciando motor de corte...')">✂️ CORTAR</button>
    <button class="tool-btn" onclick="alert('Cargando IA de voz...')">🎙️ VOZ IA</button>
    <button class="tool-btn" onclick="alert('Generando Avatar...')">👤 AVATAR</button>
    <button class="tool-btn export-btn">EXPORTAR PRO</button>
</div>

<script>
    const fileIn = document.getElementById('fileIn');
    const player = document.getElementById('player');
    const viewport = document.getElementById('viewport');

    fileIn.addEventListener('change', function() {
        const file = this.files[0];
        if (file) {
            const url = URL.createObjectURL(file);
            player.innerHTML = `<video id="v" controls autoplay muted loop>
                <source src="${url}" type="${file.type}">
            </video>`;
        }
    });

    function setRatio(ratio, btn) {
        // Quitar clase activa de otros botones
        document.querySelectorAll('.ratio-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        // Ajustar el marco según el número profesional
        if (ratio === '9:16') {
            viewport.style.width = "200px";
            viewport.style.height = "355px";
        } else if (ratio === '16:9') {
            viewport.style.width = "90%";
            viewport.style.maxWidth = "550px";
            viewport.style.height = "250px";
        } else if (ratio === '1:1') {
            viewport.style.width = "300px";
            viewport.style.height = "300px";
        } else if (ratio === '4:5') {
            viewport.style.width = "280px";
            viewport.style.height = "350px";
        }
    }
</script>

</body>
</html>
