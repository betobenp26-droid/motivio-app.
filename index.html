<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Motivio.pedro | Editor Pro</title>
    <style>
        body { background-color: #0f0f0f; color: #ffffff; font-family: sans-serif; margin: 0; padding: 0; overflow-x: hidden; }
        header { background: #1a1a1a; padding: 10px; border-bottom: 2px solid #00a8ff; text-align: center; }
        .brand { font-size: 24px; font-weight: bold; color: #00a8ff; }
        .brand span { color: white; }

        /* EL CANDADO PARA EL VIDEO */
        .preview-container {
            width: 300px; /* Tamaño inicial base */
            height: 300px;
            margin: 20px auto;
            background: #000;
            border: 2px solid #333;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden; /* NO deja salir nada */
            position: relative;
            transition: all 0.3s ease;
        }

        /* Fuerza al video a obedecer al contenedor */
        video {
            display: block;
            max-width: 100% !important;
            max-height: 100% !important;
            width: auto !important;
            height: auto !important;
            object-fit: contain;
        }

        .controls-row { display: flex; justify-content: center; gap: 10px; margin: 10px 0; flex-wrap: wrap; }
        
        button { 
            background: #262626; color: white; border: 1px solid #444; 
            padding: 12px 18px; border-radius: 6px; font-weight: bold; cursor: pointer;
            font-size: 14px;
        }
        
        button:active { background: #00a8ff; }

        .toolbar { 
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; 
            padding: 15px; max-width: 500px; margin: 0 auto; 
        }
        
        .footer { text-align: center; padding: 20px; font-size: 12px; color: #555; }
    </style>
</head>
<body>

<header>
    <div class="brand">MOTIVIO<span>.pedro</span></div>
</header>

<div class="preview-container" id="container">
    <div id="display" style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;">
        <button onclick="document.getElementById('videoInput').click()">📁 Abrir Video</button>
        <input type="file" id="videoInput" accept="video/*" style="display:none">
    </div>
</div>

<p style="text-align:center; font-size:14px; color:#aaa;">Pica un formato para ajustar la vista:</p>
<div class="controls-row">
    <button onclick="cambiarFormato('9/16')">📱 Vertical</button>
    <button onclick="cambiarFormato('16/9')">📺 Horizontal</button>
    <button onclick="cambiarFormato('1/1')">🔳 Cuadrado</button>
</div>

<div class="toolbar">
    <button onclick="alert('Motor de corte en preparación...')">✂️ Cortar</button>
    <button onclick="alert('IA de voz en preparación...')">🎙️ Voz IA</button>
    <button style="grid-column: span 2; background:#00a8ff;">💾 EXPORTAR VIDEO</button>
</div>

<div class="footer">Motivio.pedro v1.2 | Hardware del usuario activo</div>

<script>
    const videoInput = document.getElementById('videoInput');
    const display = document.getElementById('display');
    const container = document.getElementById('container');

    videoInput.addEventListener('change', function() {
        const file = this.files[0];
        if (file) {
            const url = URL.createObjectURL(file);
            display.innerHTML = `<video id="mainVideo" controls autoplay muted loop>
                <source src="${url}" type="${file.type}">
            </video>`;
        }
    });

    function cambiarFormato(ratio) {
        if (ratio === '9/16') {
            container.style.width = "225px";
            container.style.height = "400px";
        } else if (ratio === '16/9') {
            container.style.width = "90%";
            container.style.maxWidth = "600px";
            container.style.height = "250px";
        } else if (ratio === '1/1') {
            container.style.width = "300px";
            container.style.height = "300px";
        }
    }
</script>

</body>
</html>
