<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Motivio Studio</title>
    <style>
        body { background-color: #050505; color: #fff; font-family: 'Inter', sans-serif; margin: 0; padding: 0; overflow: hidden; }
        
        /* HEADER */
        header { background: #111; padding: 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; }
        .logo { font-weight: 800; color: #00a8ff; font-size: 18px; }

        /* ÁREA DE TRABAJO */
        .main-stage {
            width: 100vw;
            height: 65vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            background-image: radial-gradient(#1a1a1a 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* EL CANVAS (EL VIDEO QUE LLENA TODO) */
        .canvas {
            background: #000;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover; /* LLENA TODO EL ESPACIO, SIN BARRAS NEGRAS */
        }

        /* MENÚ DE FORMATO DESPLEGABLE */
        .format-control { position: relative; margin: 15px; text-align: center; }
        #formatBtn { 
            background: #222; color: #00a8ff; border: 1px solid #333; 
            padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer;
        }
        
        .format-menu {
            display: none; position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%);
            background: #1a1a1a; border: 1px solid #333; border-radius: 10px; width: 120px; z-index: 100;
        }
        .format-menu button {
            width: 100%; padding: 12px; background: none; border: none; color: #fff; border-bottom: 1px solid #222; cursor: pointer;
        }
        .format-menu button:hover { background: #00a8ff; }

        /* BARRA DE HERRAMIENTAS */
        .tools { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; padding: 10px; background: #111; height: 15vh; }
        .t-btn { background: #1f1f1f; color: #eee; border: none; border-radius: 8px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
        .export { background: #00a8ff; color: #fff; grid-column: span 3; height: 45px; margin-top: 5px; }

        .hidden-input { display: none; }
    </style>
</head>
<body>

<header>
    <div class="logo">MOTIVIO<span>.pro</span></div>
    <button onclick="document.getElementById('media').click()" style="background:#00a8ff; border:none; color:#fff; padding:5px 12px; border-radius:4px; font-size:12px;">+ MEDIA</button>
</header>

<div class="main-stage">
    <div class="canvas" id="canvas" style="width: 320px; height: 180px;">
        <div id="video-root" style="color:#444;">Sin medios seleccionados</div>
    </div>
</div>

<div class="format-control">
    <button id="formatBtn" onclick="toggleMenu()">FORMATO: 16:9</button>
    <div class="format-menu" id="menu">
        <button onclick="setAspect('9:16', '9:16')">9:16</button>
        <button onclick="setAspect('1:1', '1:1')">1:1</button>
        <button onclick="setAspect('16:9', '16:9')">16:9</button>
        <button onclick="setAspect('4:5', '4:5')">4:5</button>
    </div>
</div>

<div class="tools">
    <button class="t-btn" onclick="alert('Corte local activo')">✂️ RECORTAR</button>
    <button class="t-btn" onclick="alert('IA Local')">🎙️ VOZ IA</button>
    <button class="t-btn" onclick="alert('IA Local')">👤 AVATAR</button>
    <button class="t-btn export">EXPORTAR SIN MARCA</button>
</div>

<input type="file" id="media" class="hidden-input" accept="video/*">

<script>
    const canvas = document.getElementById('canvas');
    const media = document.getElementById('media');
    const menu = document.getElementById('menu');
    const btn = document.getElementById('formatBtn');

    // Subir video
    media.addEventListener('change', function() {
        const file = this.files[0];
        if (file) {
            const url = URL.createObjectURL(file);
            document.getElementById('video-root').innerHTML = `
                <video autoplay muted loop playsinline>
                    <source src="${url}" type="${file.type}">
                </video>`;
        }
    });

    // Abrir/Cerrar menú
    function toggleMenu() {
        menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
    }

    // Cambiar Aspecto PROFESIONAL
    function setAspect(ratio, label) {
        if (ratio === '9:16') {
            canvas.style.width = "200px";
            canvas.style.height = "355px";
        } else if (ratio === '1:1') {
            canvas.style.width = "300px";
            canvas.style.height = "300px";
        } else if (ratio === '16:9') {
            canvas.style.width = "320px";
            canvas.style.height = "180px";
        } else if (ratio === '4:5') {
            canvas.style.width = "240px";
            canvas.style.height = "300px";
        }
        btn.innerText = "FORMATO: " + label;
        menu.style.display = 'none';
    }
</script>

</body>
</html>
